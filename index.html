<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Видеособеседование 1 на 1 (WebRTC)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Видеособеседование 1 на 1</h1>

  <div class="controls">
    <button id="startBtn">Включить камеру и войти</button>
    <button id="callBtn" disabled>Позвонить собеседнику</button>
    <button id="hangupBtn" class="hangup" disabled>Завершить</button>
  </div>

  <div id="status">Статус: ожидание запуска</div>

  <div class="videos">
    <div class="video-box">
      <p>Вы (локальное видео)</p>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div class="video-box">
      <p>Собеседник (удалённое видео)</p>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>

  <script>
    const SIGNALING_URL = 'wss://inai-col3.fishrungames.com/signaling/';

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    const startBtn = document.getElementById('startBtn');
    const callBtn = document.getElementById('callBtn');
    const hangupBtn = document.getElementById('hangupBtn');
    const statusEl = document.getElementById('status');
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');

    let localStream = null;
    let pc = null;
    let ws = null;

    function setStatus(text) {
      statusEl.textContent = 'Статус: ' + text;
    }

    function sendSignal(data) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(data));
      }
    }

    function createPeerConnection() {
      if (pc) return pc;

      pc = new RTCPeerConnection(rtcConfig);

      // Добавляем свои треки (видео и аудио) в соединение
      if (localStream) {
        localStream.getTracks().forEach((track) => {
          pc.addTrack(track, localStream);
        });
      }

      // Получаем видео и аудио собеседника
      pc.ontrack = (event) => {
        if (event.streams && event.streams[0]) {
          remoteVideo.srcObject = event.streams[0];
          setStatus('на связи с собеседником');
        }
      };

      // Отправляем найденные ICE-кандидаты второму участнику через WebSocket
      pc.onicecandidate = (event) => {
        if (event.candidate) {
          sendSignal({
            type: 'candidate',
            candidate: event.candidate
          });
        }
      };

      pc.onconnectionstatechange = () => {
        if (pc && (pc.connectionState === 'disconnected' || pc.connectionState === 'failed')) {
          setStatus('соединение прервано');
        }
      };

      return pc;
    }

    function closePeerConnection() {
      if (pc) {
        pc.ontrack = null;
        pc.onicecandidate = null;
        pc.onconnectionstatechange = null;
        pc.close();
        pc = null;
      }
      remoteVideo.srcObject = null;
    }

    function connectSignaling() {
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
        return;
      }

      ws = new WebSocket(SIGNALING_URL);

      ws.onopen = () => {
        setStatus('подключено к signaling-серверу. Можно нажать «Позвонить собеседнику»');
        callBtn.disabled = false;
        hangupBtn.disabled = false;
      };

      ws.onmessage = async (event) => {
        let msg;
        try {
          msg = JSON.parse(event.data);
        } catch (e) {
          console.error('Невалидный JSON:', event.data);
          return;
        }

        // По протоколу сервера при выходе второго участника приходит { type: 'peer-left' }
        if (msg.type === 'peer-left') {
          setStatus('собеседник отключился');
          closePeerConnection();
          return;
        }

        const peer = createPeerConnection();

        if (msg.type === 'offer') {
          setStatus('входящий звонок, отправляем answer...');
          await peer.setRemoteDescription(new RTCSessionDescription(msg.offer));
          const answer = await peer.createAnswer();
          await peer.setLocalDescription(answer);
          sendSignal({
            type: 'answer',
            answer: answer
          });
        } else if (msg.type === 'answer') {
          setStatus('получен answer, устанавливаем соединение...');
          await peer.setRemoteDescription(new RTCSessionDescription(msg.answer));
        } else if (msg.type === 'candidate' && msg.candidate) {
          try {
            await peer.addIceCandidate(new RTCIceCandidate(msg.candidate));
          } catch (err) {
            console.error('Ошибка добавления ICE candidate:', err);
          }
        }
      };

      ws.onclose = () => {
        setStatus('отключено от signaling-сервера');
        callBtn.disabled = true;
      };

      ws.onerror = () => {
        setStatus('ошибка подключения к WebSocket');
      };
    }

    startBtn.addEventListener('click', async () => {
      try {
        setStatus('запрашиваем доступ к камере и микрофону...');
        localStream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: true
        });
        localVideo.srcObject = localStream;
        startBtn.disabled = true;
        connectSignaling();
      } catch (err) {
        console.error(err);
        setStatus('не удалось получить доступ к камере/микрофону: ' + err.message);
      }
    });

    callBtn.addEventListener('click', async () => {
      try {
        const peer = createPeerConnection();
        setStatus('создаём offer и звоним...');
        const offer = await peer.createOffer();
        await peer.setLocalDescription(offer);
        sendSignal({
          type: 'offer',
          offer: offer
        });
      } catch (err) {
        console.error(err);
        setStatus('ошибка при создании звонка: ' + err.message);
      }
    });

    hangupBtn.addEventListener('click', () => {
      closePeerConnection();
      if (localStream) {
        localStream.getTracks().forEach((track) => track.stop());
        localStream = null;
        localVideo.srcObject = null;
      }
      if (ws) {
        ws.close();
        ws = null;
      }
      startBtn.disabled = false;
      callBtn.disabled = true;
      hangupBtn.disabled = true;
      setStatus('звонок завершён');
    });
  </script>
</body>
</html>
